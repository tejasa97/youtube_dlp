    known_deviation: Related files use the port's deterministic normalized metadata schema. Implemented artifact types have per-type output templates; annotation sidecars and non-atomic Windows replacement where the platform cannot provide it remain outside this claim.

  - id: cli.output_artifact_controls
    name: Output naming and metadata artifact controls
    phase: 3
    compatibility_target: Provide bounded yt-dlp-compatible ID naming, missing-field placeholders, autonumber lifecycle, info JSON cleaning/loading, and confined cache removal through the native output and metadata transaction layers.
    status: partial
    evidence:
      - pkg/ytdlp.TestOutputArtifactTemplatePlaceholderAndAutonumberCompatibility
      - pkg/ytdlp.TestInfoJSONCleaningPreservesPublicMetadataAndExplicitOverride
      - pkg/ytdlp.TestLoadInfoJSONDownloadsBoundedMetadataWithoutAmbientCredentials
      - pkg/ytdlp.TestLoadInfoJSONPreservesAcceptedAutonumberOnOutputFailure
      - pkg/ytdlp.TestLoadInfoJSONRejectsUnsafeShapesBoundsAndCancellation
      - pkg/ytdlp.TestAutonumberCountsOnlyAcceptedPlaylistEntries
      - internal/cache.TestRemoveRootIsConfinedAtomicAndCancellationAware
      - internal/cli.TestOutputArtifactFlagsAndIDOrdering
      - internal/cli.TestLoadInfoJSONAndRemoveCacheCLIRequestsAreURLIndependent
      - internal/cli.TestCLIPropagatesAutonumberAcrossMultipleInputs
      - conformance/output_artifacts/PROVENANCE.md
    owner: core
    depends_on:
      - cli.metadata_sidecars
      - compat.output_template_minimal
      - metadata.deterministic_json
    known_deviation: Load-info-json is bounded to one single-video metadata envelope and never restores cookies, browser cookies, netrc, or password credentials. A distinct validated webpage_url is retried only after an uncommitted direct top-level URL fails with a network/internal/unsupported error; broader DownloadError/ReExtractInfo compatibility is not claimed. Playlist metafiles retain entries under the default setting; explicit cleaning and no-clean modes are covered. Arbitrary Python objects, unsupported output-template types, custom cache roots without cache-identifying path components, and Windows destructive cache cleanup remain outside this claim.

