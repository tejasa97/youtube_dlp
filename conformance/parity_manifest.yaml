    known_deviation: "Compatibility is scoped to the bounded Phase 2 corpus. Match filters support the documented boolean, string, numeric, none-inclusive, filesize, and duration grammar with explicit evaluation bounds; break-match filters reuse that grammar and stop playlist expansion before the rejected entry. Exact `-` marker prompting is supported on ordinary and breaking filters for complete, non-archived entries; flat/incomplete entries, no-format entries, and automatic subtitle-only listing do not prompt, explicit simulation and combined metadata-output modes do, and breaking-prompt acceptance preserves the pinned ordinary-filter bypass. Prompts use each selected output plan's filename in stable order, format-dependent conditions are reevaluated against that selection, and merged A/V fields follow the pinned merge policy. Interactive filtering is intentionally rejected with `--progress-json` to preserve its machine-readable stderr contract. Match-filter regex is the bounded Python-compatible subset translated by `internal/compat/pyregex.Translate` and compiled with `regexp2`. Open quantifiers compile; safety is enforced at execution time by source, translated, and per-input byte limits (`maxRegexBytes=512`, `maxTranslatedRegexBytes=16<<10`, `maxRegexInputBytes=64<<10`), per-match attempts (`maxRegexAttempts=256`), aggregate inspected bytes (`maxRegexInspectedBytes=4<<20`), per-match wall time (`regexp2.MatchTimeout=regexMatchTimeout=25ms`), and aggregate wall time (`regexWallBudget=250ms`, enforced in `internal/compat/matchfilter/filter.go::searchPythonRegex`). Patterns that exceed the source or translated byte budget or fail translation are rejected at parse/compile time. Chapter-removal regex uses the same adapter with the analogous chapter-removal bounds (`internal/compat/chapterremove/program.go::Parse` -> `pyregex.Translate`, `MaxRegexSourceBytes=4096`, `MaxRegexTranslatedBytes=16<<10`, `MaxRegexInputBytes=64<<10`, `MaxRegexAttempts=256`, `MaxRegexInspectedBytes=4<<20`, `RegexMatchTimeout=25ms`, `RegexAggregateWallBudget=250ms`) and a shared `EvaluationBudget` over the entire media item (`internal/compat/chapterremove/program.go::MatchTitleWithBudget`). The supported surface is the bounded Python-compatible subset translated by `internal/compat/pyregex`: anchors, character classes, repetition, alternation, lookahead and lookbehind, and bounded backreferences. Other Python regular expression features remain unsupported. Template arithmetic and Unicode conversions are limited to the bounded corpus; arbitrary template code evaluation and remaining CLI format-selection surfaces remain explicitly unsupported.
"
