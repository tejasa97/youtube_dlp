    owner: runtime
    known_deviation: "Native plugin RPC is wired into `internal/sandbox` on Linux through the production `Client.exchange` path: when a trusted package is configured with a `SandboxConfig`, `internal/plugin/rpc/client.go` calls `sandbox.PrepareForOS` (or `sandbox.Prepare` with the host lookup) to build a plan and runs the plugin under `bwrap`, and additionally under `prlimit` when host resource caps are set. Both adapters are selected only with explicit `AllowExternalTools=true` and a missing adapter fails closed (`internal/sandbox/sandbox.go::PrepareForOS`, `internal/sandbox/sandbox_test.go::TestLinuxPlanRequiresExplicitExternalAdapterPolicy`, `internal/sandbox/sandbox_test.go::TestPrepareRejectsMissingAdapterAndUnsupportedPlatforms`). The plugin RPC transport does not implement a portable CPU, address-space, or process-count quota in its own transport; the caps live in `internal/sandbox.Limits` and are honoured by the Linux adapter. `internal/sandbox.PrepareForOS` rejects `GOOS=windows` with `ErrUnsupportedPlatform` so the generic product sandbox never runs on Windows. The Windows Job Object path (`internal/plugin/rpc/process_windows.go::configureIsolation`, `attachIsolation`, `resumeInitialThread`) closes the start-before-Job race in that internal code by spawning suspended, assigning the Job, and only then resuming the initial thread. It is reached only through the explicit `UnsafeTestOnly` internal test/direct-RPC seam (`internal/plugin/rpc/client.go::exchange` -> `configureIsolation` -> `command.Start` -> `attachIsolation`); a signed package without `SandboxConfig` is rejected with `plugin.ErrIsolationUnavailable` before approval or process creation, while a signed product call that configures `SandboxConfig` fails closed at `PrepareForOS(windows)` before command start. The Job path is internal code, not product containment evidence. The macOS `sandbox-exec` path is removed and macOS generic plans fail closed with `internal/sandbox.ErrAdapterUnavailable`. WASM enforces message, memory-page, and wall-clock limits; wazero v1.9 has no stable instruction-fuel API, so a non-zero `Limits.WASMInstructionBudget` is rejected with `plugin.ErrIsolationUnavailable` rather than silently falling back to wall-clock-only accounting (`internal/plugin/wasm/host.go`, `internal/plugin/wasm/host_test.go::TestWASMInstructionBudgetFailsClosedWithoutFuelAPI`). Secure discovery still fails closed on Windows because portable Go `FileMode` cannot prove owner/DACL. The Windows updater health-check start-before-Job race is a separate concern tracked in the security audit as `G2-S01` and is not addressed by the plugin RPC work. Plugins are product-routed only by explicit signed installation and PluginID selection.
"
