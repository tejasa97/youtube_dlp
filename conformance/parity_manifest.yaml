    known_deviation: Compatibility is scoped to the pinned video, playlist-continuation, exact public UCID, pinned Unicode-aware `@handle`, and bounded Unicode legacy `/user` and `/c` alias explicit `/videos`, `/shorts`, `/streams`, `/playlists`, `/home`, `/featured`, `/community`, `/releases`, `/podcasts`, and `/membership` tabs, plus channel-advertised custom tabs securely bound to the requested identity, channel-local `/search?query=` routes, bare channel/handle/alias roots that lazily aggregate advertised videos, streams, and Shorts or try the synthesized `UU<channel-suffix>` uploads playlist, bounded public `ytsearch` (video-filtered) and results-URL search that emits video/Shorts/playlist/channel/shelf URL results with supported decoded `sp` filters (hashtag tiles emit registered `youtube_hashtag` URL results; show/grid-show playlist renderers and attributable availability badges are included; playlist/view pre-fetch counts are emitted when sidebar/header text is attributable), bounded YouTube Music default/song/video/album/artist/playlist section search with podcast lockups as URL results and registered Music browse families (`MPRE`/`MPSP`/`VL`/`UC`/`MPLA`) consumed by cookie-isolated WEB_REMIX `youtube_music_browse` (isolation required before any network call including initial GET; anonymous public success; albums require canonical music.youtube.com playlist identity or fail closed; empty album pages hydrate via WEB_REMIX resolve+browse with identity-equality checks; auth/premium Music fail closed), bounded opt-in public and authenticated-WEB comments, authenticated exact-origin WEB browse/search continuations (browse visitor rotation; search reuses the initial visitor; incomplete logged-in config fails closed without anonymous fallback), live-HLS, finite post-live DVR reconstruction, opt-in active live-from-start reconstruction, structured player-config discovery, native-client recovery, authenticated exact-origin WEB player format recovery, manual/automatic/translated caption renderer, bounded subtitle listing with explicit simulation control, sidecar selection/download/conversion/embedding, and explicit native-Go PO-token provider corpus. Mixed home feeds accept video and playlist renderers; community feeds emit attached and inline media URL results with per-post duplicate suppression and cross-post occurrence retention; releases and podcasts emit playlist results; membership feeds emit video results only when the supplied transport/session is already authorized. Bare roots exclude home shelves and membership, preserve upload occurrence order, support no-videos and empty channels, and enforce one aggregate entry bound. Comment retrieval supports top/new ordering, visitor rotation, legacy and modern fields, inline replies, click-tracked reply continuations, nested subthreads, pinned duplicate handling, bounded transient/incomplete retries, actual retrieved counts, and explicit total/parent/reply/per-thread/depth limits. Signed-in WEB comments and browse/search continuations keep requests inside the exact-origin no-redirect cookie boundary; WEB and WEB_REMIX identities never cross. It does not claim other authenticated comment clients, estimated timestamps, upstream's configurable ignore-error policy, or untested renderer families. Anonymous visitor identity is propagated across bounded, cookie-isolated Android, Android VR, web_safari, iOS, and mweb recovery requests, enabling URL-bearing adaptive video/audio recovery. Logged-in watch pages with valid SID cookies use redirect-disabled WEB player and comment requests, then authenticated defaults `tv_downgraded`/`web_safari` or premium `tv_downgraded`/`web_creator` (Premium changes GVS PO-token requirements only; non-Premium `web_creator` only when age-gated playability is attributable; first successful candidate wins with no cross-player merge); credentials never cross into anonymous clients and WEB_REMIX never enters video recovery. Availability badges use order-independent precedence; count text accepts canonical grouped integers or k/m/b/kk with allowlisted trailing nouns only. Player, GVS, and subtitle token placement is supported through an embedding-provided Go provider; no built-in generator, implicit endpoint, executable, Python bridge, persistent cache, or upstream external-provider protocol is claimed. Existing sidecars fail closed unless overwrite is enabled. Search is capped at 50 results. Membership entitlement acquisition, Python-regex-only language rules, external live-generator delegation, authenticated Music success, and unregistered Music browse prefixes remain pending. The retained bounded finite-VOD SABR/UMP implementation is an experimental extension outside this compatibility target; no SABR expansion is a parity blocker or roadmap item.

