version: 1
capabilities:
  - id: extractor.rai
    name: Rai public ecosystem
    phase: 1
    compatibility_target: Extract the bounded public RaiPlay, RaiPlay Sound, legacy Rai, Rai News, Rai Cultura, and Rai Südtirol route families through a shared relinker backend.
    status: partial
    evidence:
      - internal/extractor.TestRaiRoutingMatrixAndHostHardening
      - internal/extractor.TestRaiPlayRelinkerMetadataAndAudioCodec
      - internal/extractor.TestRaiRelinkerGeoDRMAndMalformed
      - internal/extractor.TestRaiLiveAndSoundIdentityFlows
      - internal/extractor.TestRaiSudtirolSMILIdentityAndHLS
      - internal/extractor.TestRaiIdentityCancellationAndSecretSafety
      - internal/extractor.TestRaiIdentityFallbackAndTimestampPolicies
      - internal/extractor.TestRaiSoundPodcastMetadata
      - internal/extractor.TestRaiSoundUnfilteredPlaylistDescription
      - internal/extractor.TestRaiPublicURLRejectsLocalAndIPLiteralVariants
      - internal/extractor.TestRaiF4MFormatEmissionPreservesSignedQuery
      - internal/extractor.TestRaiF4MLegacyManifestShapeNormalizesWithoutDroppingQuery
      - internal/extractor.TestRaiF4MExistingPinnedControlsRemainByteExact
      - internal/extractor.TestRaiF4MConflictingControlsAreRejected
      - internal/extractor.TestRaiF4MRejectsUnsafeRecognizedURLs
      - pkg/ytdlp.TestProductRaiF4MExtractionBridgesIntoHDSAndAssemblesFLV
      - pkg/ytdlp.TestProductRaiF4MBridgeFailureCleansDestinationAndPreservesCategory
      - pkg/ytdlp.TestProductRaiF4MBridgeCancellationCleansDestination
      - pkg/ytdlp.TestProductRaiF4MBridgeSizeBoundCleansDestinationAndPreservesCategory
      - pkg/ytdlp.TestProductRaiF4MBridgePreservesLiveAndDRMRestrictions
      - internal/extractor.TestRaiPlaylistSkipsBrokenOrUnavailableSets
      - internal/extractor.TestRaiPlaylistPreservesCancellationAndMeaningfulSetFailures
      - internal/extractor.TestRaiThumbnailsAreStableAndBounded
      - internal/extractor.FuzzRaiURLClassification
      - internal/extractor.FuzzRaiRelinkerXML
      - pkg/ytdlp.TestProductRegistryRoutesRaiAndPlaylistReentry
      - conformance/extractors/rai/PROVENANCE.md
      - docs/EXTRACTOR_RAI_ECOSYSTEM_EVIDENCE.md
    owner: core
    known_deviation: Bounded Rai relinker F4M/HDS VOD emission is wired to the generic native HDS downloader, including signed-query preservation, credential isolation, atomic cleanup, and categorized live/DRM rejection. The HDS claim is limited to synthetic unencrypted VOD fixtures; authenticated pages, untested HTML state, remote-schema variants, and encrypted/live playback remain outside this public fixture-backed scope.
  - id: extractor.prx
    name: PRX CMS stories, series, accounts, and search
    phase: 1
    compatibility_target: Extract exact public numeric PRX story, series, and account routes plus pinned prxstories/prxseries opaque searches through the bounded CMS API with canonical URL-result re-entry.
    status: compatible
    evidence:
      - internal/extractor.TestPRXRoutesAndStory
      - internal/extractor.TestPRXStatusAndPagination
      - internal/extractor.FuzzPRXTarget
      - internal/extractor.TestPRXSearchRoutingAndResults
      - internal/extractor.FuzzPRXSearchTarget
      - conformance/extractors/prx/PROVENANCE.md
    owner: core
    known_deviation: PRX support is bounded to the pinned numeric routes and opaque story/series search keys; synthetic fixtures do not prove behavior against future live API schema changes.
