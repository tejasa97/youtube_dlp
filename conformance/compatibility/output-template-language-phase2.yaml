version: 1
reference:
  repository: https://github.com/yt-dlp/yt-dlp
  commit: aefce1eea4d0b6bab1ec2bd3beff09bff91a39c8
  interpreter: source-audited only; no compliant Python oracle run (host Python 3.9.6; see OUTPUT_TEMPLATE_LANGUAGE_PHASE2_PROVENANCE.md)
cases:
  - name: literals-percent-and-fields
    pattern: '%% %(title)s.%(ext)s'
    rendered: '% A: video?.mp4'
  - name: traversal-index-slice-and-projection
    pattern: '%(chapters.-1.title)s %(numbers.1:4:2)j %(.{id,chapters.0.title})j'
    rendered: 'last [1, 3] {"id": "fixture-1", "chapters.0.title": "first"}'
  - name: alternatives-defaults-and-replacement
    pattern: '%(missing,uploader|anonymous)s %(missing|anonymous)s %(uploader&literal)s %(uploader&{:>8})s'
    rendered: 'alice anonymous literal    alice'
  - name: arithmetic-and-numeric-conversions
    pattern: '%(view_count+8)04d %(view_count)u %(view_count)#x %(rating).2E'
    rendered: '0050 42 0x2a 4.25E+00'
  - name: attributed-utc-date-timezone
    pattern: '%(epoch>%Y-%m-%d %H:%M:%S %z %Z %s)s %(upload_date>%a %b %d %Y)s'
    rendered: '1970-01-01 00:00:00 +0000 UTC 0 Fri Jul 17 2026'
  - name: json-repr-and-unicode
    pattern: '%(.{id,title})j %(unicode)r %(unicode)a'
    rendered: |-
      {"id": "fixture-1", "title": "A: video?"} 'á 𝐀' '\xe1 \U0001d400'
  - name: missing-null-and-nested-expression
    pattern: '%(none|default)s %(missing&<{}>)s %(chapters.:.title)l'
    rendered: 'default <NA> first, last'
